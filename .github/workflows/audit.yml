name: Reproduce Verilog project audits
on:
  push:
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [check_project_01.py, check_project_02.py, check_project_03.py, check_project_04.py, check_inventory.py]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iverilog
      - name: Record tool versions
        run: |
          iverilog -V 2>/dev/null | head -n 1
          python --version
      - run: python checks/${{ matrix.suite }}
